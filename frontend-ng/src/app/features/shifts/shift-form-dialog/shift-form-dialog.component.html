<h2 mat-dialog-title>{{ isEdit ? 'แก้ไขกะการทำงาน' : 'เพิ่มกะการทำงาน' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>ชื่อกะ *</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <p class="days-label">วันที่ใช้กะนี้ *</p>
    <div class="days-row">
      <mat-checkbox formControlName="mon" matTooltip="วันจันทร์">จ</mat-checkbox>
      <mat-checkbox formControlName="tue" matTooltip="วันอังคาร">อ</mat-checkbox>
      <mat-checkbox formControlName="wed" matTooltip="วันพุธ">พ</mat-checkbox>
      <mat-checkbox formControlName="thu" matTooltip="วันพฤหัสบดี">พฤ</mat-checkbox>
      <mat-checkbox formControlName="fri" matTooltip="วันศุกร์">ศ</mat-checkbox>
      <mat-checkbox formControlName="sat" matTooltip="วันเสาร์">ส</mat-checkbox>
      <mat-checkbox formControlName="sun" matTooltip="วันอาทิตย์">อา</mat-checkbox>
    </div>

    <div class="form-grid">
      <app-time-picker label="เริ่มเข้างาน" formControlName="checkin_start"></app-time-picker>
      <app-time-picker label="ตรงเวลาถึง" formControlName="checkin_end"></app-time-picker>
      <app-time-picker label="สายได้ถึง" formControlName="late_cutoff"></app-time-picker>
      <app-time-picker label="เริ่มออกงาน" formControlName="checkout_start"></app-time-picker>
      <app-time-picker label="สิ้นสุดออกงาน" formControlName="checkout_end"></app-time-picker>
      <app-time-picker label="เริ่ม OT" formControlName="ot_start"></app-time-picker>
      <app-time-picker label="สิ้นสุด OT" formControlName="ot_end"></app-time-picker>
    </div>

    <p class="hint">
      ลำดับเวลาต้องเรียงจากน้อยไปมาก (เริ่มเข้างาน ≤ ตรงเวลา ≤ สายได้ถึง ≤ เริ่มออกงาน ≤ สิ้นสุดออกงาน ≤ เริ่ม OT ≤ สิ้นสุด OT)
    </p>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()" [disabled]="saving()">ยกเลิก</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
      @if (saving()) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        บันทึก
      }
    </button>
  </mat-dialog-actions>
</form>
